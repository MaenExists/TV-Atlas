<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0a1a2b"/>
      <stop offset="60%" stop-color="#050c14"/>
      <stop offset="100%" stop-color="#020508"/>
    </radialGradient>

    <!-- Neon Cyan Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Green Glow -->
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0088cc"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00aa44"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Plate -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGlow)" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.4"/>
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="#00ff66" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Satellite / TV Antenna on Top -->
  <g filter="url(#cyanGlow)">
    <!-- Antenna Beams -->
    <path d="M 190 135 L 256 195 L 322 135" fill="none" stroke="#00f0ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="256" cy="195" r="10" fill="#00ff66"/>
    <!-- Radio Signal Waves -->
    <path d="M 216 110 A 55 55 0 0 1 296 110" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.75"/>
    <path d="M 186 85 A 95 95 0 0 1 326 85" fill="none" stroke="#00ff66" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5"/>
  </g>

  <!-- 3D Globe Outer Rim -->
  <circle cx="256" cy="300" r="145" fill="#040d16" stroke="#00f0ff" stroke-width="7" filter="url(#cyanGlow)"/>

  <!-- Globe Longitude Ellipses -->
  <ellipse cx="256" cy="300" rx="110" ry="145" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-opacity="0.55"/>
  <ellipse cx="256" cy="300" rx="65" ry="145" fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.7"/>
  <line x1="256" y1="155" x2="256" y2="445" stroke="#00f0ff" stroke-width="3.5" stroke-opacity="0.85"/>

  <!-- Globe Latitude Arcs -->
  <ellipse cx="256" cy="300" rx="145" ry="40" fill="none" stroke="#00f0ff" stroke-width="3.5" stroke-opacity="0.85"/>
  <ellipse cx="256" cy="235" rx="130" ry="28" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-opacity="0.55"/>
  <ellipse cx="256" cy="365" rx="130" ry="28" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-opacity="0.55"/>

  <!-- Active Signal Transmitter Nodes (Hacker Green) -->
  <g filter="url(#greenGlow)">
    <!-- Signal Nodes -->
    <circle cx="210" cy="250" r="8" fill="#00ff66"/>
    <circle cx="210" cy="250" r="15" fill="none" stroke="#00ff66" stroke-width="2" stroke-opacity="0.7"/>

    <circle cx="315" cy="280" r="7" fill="#00ff66"/>
    <circle cx="315" cy="280" r="13" fill="none" stroke="#00ff66" stroke-width="2" stroke-opacity="0.7"/>

    <circle cx="265" cy="330" r="8.5" fill="#00ff66"/>
    <circle cx="265" cy="330" r="16" fill="none" stroke="#00ff66" stroke-width="2.2" stroke-opacity="0.7"/>

    <circle cx="175" cy="340" r="6" fill="#00ff66"/>
    <circle cx="330" cy="360" r="6.5" fill="#00ff66"/>
    <circle cx="240" cy="220" r="6" fill="#00ff66"/>
  </g>

  <!-- Center Target Reticle -->
  <g stroke="#00f0ff" stroke-width="2" stroke-linecap="round">
    <line x1="244" y1="300" x2="249" y2="300"/>
    <line x1="263" y1="300" x2="268" y2="300"/>
    <line x1="256" y1="288" x2="256" y2="293"/>
    <line x1="256" y1="307" x2="256" y2="312"/>
    <circle cx="256" cy="300" r="4" fill="#00f0ff"/>
  </g>

  <!-- Cyber Scanline Shading -->
  <path d="M 120 440 L 392 440" stroke="#00ff66" stroke-width="2" stroke-dasharray="8,6" stroke-opacity="0.4"/>
  <path d="M 160 452 L 352 452" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6,8" stroke-opacity="0.3"/>
</svg>