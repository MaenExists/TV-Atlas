[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tv-atlas"
version = "1.0.0"
description = "Interactive 3D Earth globe television explorer for thousands of worldwide live broadcast signals"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "TV Atlas Contributors" }
]
keywords = ["television", "tv", "globe", "3d", "pyside6", "qml", "mpv", "streaming", "broadcast"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video :: Display",
]
dependencies = [
    "PySide6>=6.5.0",
]

[project.scripts]
tv-atlas = "main:main"

[project.urls]
Homepage = "https://github.com/MaenExists/TV-Atlas"
Repository = "https://github.com/MaenExists/TV-Atlas.git"
